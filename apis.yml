apis:
- name: SchemaSure Structured Extraction API
  description: REST API (OpenAPI 3.1) exposing POST /v2/extract for text/HTML and POST /v2/extract-image for document
    images (both x402 V2 paid, charge-only-on-success), a deprecated legacy POST /extract with 3 free evaluation
    calls per client, and GET /health. Converts unstructured content into JSON guaranteed to validate against a
    caller-supplied JSON Schema (Ajv, draft 2020-12) or returns a typed error at no charge. Documented for agents
    via llms.txt and a machine-readable well-known surface (x402 manifests, pricing, benchmarks, data-handling contract).
