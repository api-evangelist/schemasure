                    offset: -05:00
                    offset_minutes: -300
                    abbreviation: EST
                    local_time: '2026-11-01T01:30:00'
                    interpretation: later
                  utc_instant: null
                  local_time: null
                  offset: null
                  offset_minutes: null
                  abbreviation: null
                  date: '2026-11-01'
                  day_of_week: 7
                  is_weekend: true
                  is_holiday: false
                  holiday_name: null
                  holiday: null
                  is_working_day: false
                  is_within_working_hours: null
                  working_hours:
                    start: 09:00
                    end: '17:00'
                  business_days_result: null
                  next_valid_working_instant: null
                  previous_valid_working_instant: null
                  next_transition:
                    at_utc: '2027-03-14T07:00:00Z'
                    kind: gap
                    shift_minutes: 60
                    offset_before: -05:00
                    offset_after: -04:00
                    offset_before_minutes: -300
                    offset_after_minutes: -240
                    abbreviation_before: EST
                    abbreviation_after: EDT
                    local_before: '2027-03-14T02:00:00'
                    local_after: '2027-03-14T03:00:00'
                  previous_transition:
                    at_utc: '2026-11-01T06:00:00Z'
                    kind: fold
                    shift_minutes: -60
                    offset_before: -04:00
                    offset_after: -05:00
                    offset_before_minutes: -240
                    offset_after_minutes: -300
                    abbreviation_before: EDT
                    abbreviation_after: EST
                    local_before: '2026-11-01T02:00:00'
                    local_after: '2026-11-01T01:00:00'
                  comparisons: []
                  overlap:
                    has_overlap: false
                    working_hours:
                      start: 09:00
                      end: '17:00'
                    working_hours_source: default
                    zones:
                    - America/New_York
                    windows: []
                    intersection: null
                  coverage:
                    calendar: null
                    jurisdictions: []
                    coverage_years: null
                    weekend_days:
                    - 6
                    - 7
                    date_in_coverage: true
                    holiday_dataset_version: 2026.08.03
                    available_calendars:
                    - AU-NSW
                    - CA-BC
                    - CA-ON
                    - DE
                    - FR
